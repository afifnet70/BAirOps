# Batch serving: every hour, forecast all 30 cities with the PRODUCTION model from the MLflow registry
# and publish the dashboard + JSON API to GitHub Pages (free).
name: Publish forecasts
on:
  schedule:
    - cron: "7 * * * *"          # every hour at :07
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency: {group: pages, cancel-in-progress: true}

env:
  MLFLOW_TRACKING_URI: https://dagshub.com/${{ secrets.DAGSHUB_USER }}/${{ github.event.repository.name }}.mlflow
  MLFLOW_TRACKING_USERNAME: ${{ secrets.DAGSHUB_USER }}
  MLFLOW_TRACKING_PASSWORD: ${{ secrets.DAGSHUB_TOKEN }}

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.13", cache: pip, cache-dependency-path: requirements-api.txt}
      - run: pip install -r requirements-api.txt
      - name: Forecast all cities with the production model
        run: python scripts/publish_forecasts.py --out site
      - uses: actions/upload-pages-artifact@v3
        with: {path: site}
      - id: deploy
        uses: actions/deploy-pages@v4
