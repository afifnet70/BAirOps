# Manual rollback: set an earlier registry version as production and reload the live service.
name: Rollback
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to restore (leave empty = previous version)"
        required: false
        default: ""

permissions:
  actions: write

env:
  MLFLOW_TRACKING_URI: https://dagshub.com/${{ secrets.DAGSHUB_USER }}/${{ github.event.repository.name }}.mlflow
  MLFLOW_TRACKING_USERNAME: ${{ secrets.DAGSHUB_USER }}
  MLFLOW_TRACKING_PASSWORD: ${{ secrets.DAGSHUB_TOKEN }}

jobs:
  rollback:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.13"}
      - run: pip install "mlflow-skinny>=2.16,<4" pyyaml
      - run: python scripts/rollback.py --version "${{ inputs.version }}"
        env: {PYTHONPATH: src}
      - name: Publish forecasts with the restored model
        env: {GH_TOKEN: "${{ github.token }}"}
        run: gh workflow run pages.yml
