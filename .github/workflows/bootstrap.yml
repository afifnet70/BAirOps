# ONE-TIME setup: version the dataset with DVC, register the Phase-1 stacked ensemble as v1 (production)
# in the MLflow registry, then deploy. Needs a GitHub Release (default tag v1-assets) containing
# the dataset zip and bairops_H24.joblib.
name: Bootstrap
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag that holds the dataset zip + model .joblib"
        default: v1-assets

permissions:
  contents: write
  actions: write

concurrency: {group: bootstrap, cancel-in-progress: false}

env:
  MLFLOW_TRACKING_URI: https://dagshub.com/${{ secrets.DAGSHUB_USER }}/${{ github.event.repository.name }}.mlflow
  MLFLOW_TRACKING_USERNAME: ${{ secrets.DAGSHUB_USER }}
  MLFLOW_TRACKING_PASSWORD: ${{ secrets.DAGSHUB_TOKEN }}
  DVC_URL: https://dagshub.com/${{ secrets.DAGSHUB_USER }}/${{ github.event.repository.name }}.dvc

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.13", cache: pip}
      - run: pip install -r requirements.txt
      - name: Download release assets
        env: {GH_TOKEN: "${{ github.token }}"}
        run: |
          gh release download "${{ inputs.release_tag }}" -D assets
          ls -la assets
          ZIP=$(ls assets/*.zip 2>/dev/null | head -n1)
          BUNDLE=$(ls assets/bairops*.joblib 2>/dev/null | head -n1)
          if [ -z "$ZIP" ]; then echo "::error::No dataset .zip attached to release ${{ inputs.release_tag }}"; exit 1; fi
          if [ -z "$BUNDLE" ]; then echo "::error::No bairops*.joblib model attached to release ${{ inputs.release_tag }}"; exit 1; fi
          echo "dataset: $ZIP | model: $BUNDLE"
          cp "$ZIP" data/raw/aqi_bangladesh.zip
          echo "BUNDLE=$BUNDLE" >> $GITHUB_ENV
      - name: Version the dataset with DVC (remote = DagsHub)
        run: |
          dvc remote add -d -f origin "$DVC_URL"
          dvc remote modify origin --local auth basic
          dvc remote modify origin --local user "${{ secrets.DAGSHUB_USER }}"
          dvc remote modify origin --local password "${{ secrets.DAGSHUB_TOKEN }}"
          dvc add data/raw/aqi_bangladesh.zip
          dvc push
      - name: Register the Phase-1 model as v1 (production)
        run: python scripts/register_model.py --bundle "$BUNDLE"
      - name: Commit DVC pointer files
        run: |
          git config user.name "bairops-bot"; git config user.email "bairops-bot@users.noreply.github.com"
          git add data/raw/aqi_bangladesh.zip.dvc data/raw/.gitignore .dvc/config
          git commit -m "data: version dataset with DVC (bootstrap)" || echo "nothing to commit"
          git push
      - name: Deploy
        env: {GH_TOKEN: "${{ github.token }}"}
        run: gh workflow run deploy.yml
