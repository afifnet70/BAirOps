# Continuous deployment: after CI passes on main, publish the serving container image
# (FastAPI + stacked ensemble) to GitHub Container Registry and refresh the live forecasts site.
name: Deploy
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  actions: write

jobs:
  deploy:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/bairops
    steps:
      - uses: actions/checkout@v4
      - name: Log in to GitHub Container Registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Build and push the serving image
        run: |
          IMAGE=$(echo "$IMAGE" | tr '[:upper:]' '[:lower:]')
          docker build -t "$IMAGE:latest" -t "$IMAGE:${GITHUB_SHA::7}" .
          docker push --all-tags "$IMAGE"
          echo "### Image published: \`$IMAGE:${GITHUB_SHA::7}\`" >> $GITHUB_STEP_SUMMARY
      - name: Refresh the live forecasts site
        env: {GH_TOKEN: "${{ github.token }}"}
        run: gh workflow run pages.yml
