# BAirOps — single source of truth for data, features, training and operations settings.
project:
  name: BAirOps
  model_name: bairops-stacking          # name of the model in the MLflow model registry
  seed: 42

data:
  raw_zip: data/raw/aqi_bangladesh.zip  # DVC-tracked original dataset
  updates_csv: data/raw/updates.csv     # DVC-tracked newer hours fetched from Open-Meteo by the retrain job
  valid_start: "2022-08-04"             # common start of all 30 stations
  include_dhaka_2000_2022: true         # same setting as the Phase-1 (v1) model
  max_interp_gap_h: 6
  timezone_offset_h: 6                  # data are UTC, Bangladesh = UTC+6

features:
  horizon_h: 24                         # forecast AQI 24 h ahead

train:
  base_models: [RandomForest, XGBoost, LightGBM, CatBoost]
  ensemble: Ensemble-Stacking           # the proposed model
  max_boost_rounds: 3000
  early_stop: 100
  holdout_days: 60                      # newest days kept unseen to compare candidate vs production
  val_days: 180                         # days before the holdout used for early stopping + stacking weights
  params:
    RandomForest: {n_estimators: 200, max_depth: 20, min_samples_leaf: 20, max_features: 0.5, max_samples: 0.3}
    XGBoost: {learning_rate: 0.05, max_depth: 8, min_child_weight: 5, subsample: 0.8, colsample_bytree: 0.8, reg_lambda: 1.0}
    LightGBM: {learning_rate: 0.05, num_leaves: 63, min_child_samples: 50, subsample: 0.8, colsample_bytree: 0.8, reg_lambda: 1.0}
    CatBoost: {learning_rate: 0.08, depth: 8, l2_leaf_reg: 3.0, subsample: 0.8}

promotion:                              # quality gate for automatic model promotion
  min_rmse_improvement_pct: 0.5         # candidate must beat production RMSE on the holdout by >= 0.5 %
  max_very_unhealthy_mae_increase_pct: 5.0   # and must not be > 5 % worse on AQI > 200 hours

monitoring:
  window_days: 7                        # live evaluation window
  rmse_alert_factor: 1.30               # alert if live RMSE > 1.3 x the model's test RMSE
  psi_alert: 0.50                       # alert if PSI of AQI / PM2.5 > 0.5 (7-day windows are noisy; 0.2-0.3 is normal)

pi_alpha: 0.10                          # 90 % prediction interval
